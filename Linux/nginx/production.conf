# =============================================================================
# wen-an（简心文案库）生产环境 Nginx 配置
# =============================================================================
# 适用：Next.js 16（App Router，Node Server 模式，默认监听 127.0.0.1:3000）
#
# 维护约定（重要！）：
#   以后每新增一个需要对外暴露的路由 / 服务 / 端口，都必须回到本文件
#   同步增加对应的 location / server 配置，并在 Linux/README.md 记录。
#   遗漏同步会导致线上 404 / 502，排查成本很高。
#
# 使用：
#   1. 将本文件软链或复制到 /etc/nginx/conf.d/wen-an.conf
#   2. 把下方 server_name 与 SSL 证书路径替换为实际域名
#   3. nginx -t && systemctl reload nginx
# =============================================================================

# ---- HTTP：强制跳转 HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name wenan.qvqa.cn;  # TODO: 替换为后台「站点设置 → 站点域名」对应的域名

    # 除 ACME 证书续签外一律跳 HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;   # certbot 的 webroot，未使用可删除本段
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS 主站 ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wenan.qvqa.cn;  # TODO: 替换为实际域名

    # ---- SSL 证书（Let's Encrypt / 云厂商签发均可）----
    ssl_certificate     /etc/letsencrypt/live/wenan.qvqa.cn/fullchain.pem;  # TODO
    ssl_certificate_key /etc/letsencrypt/live/wenan.qvqa.cn/privkey.pem;    # TODO
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- 通用安全头（可按需增删）----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- 上传体积：文案站点很小，默认即可；如开放大图上传再调大 ----
    client_max_body_size 10m;

    # 统一后端：Node Server 的监听地址
    set $app 127.0.0.1:3000;

    # 关键转发头：限流中间件依赖 X-Forwarded-For 获取真实 IP，
    # 务必保留！否则全站匿名用户会被限流中间件视为同一 IP。
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- 页面与动态路由：全部转发给 Next.js ----
    location / {
        proxy_pass http://$app;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        # WebSocket 支持：如以后接入实时推送（投稿进度 / 站内消息等），
        # 需要升级协议头；当前项目无 WS 服务，保留模板以备后续服务同步使用。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ---- Next.js 静态产物：/._next 由 Turbopack 构建产出，可强缓存 ----
    location /_next/static/ {
        proxy_pass http://$app;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- 图片优化：Next.js 内置 <Image> 会请求 /_next/image?url=…，必须转发 ----
    location /_next/image {
        proxy_pass http://$app;
        proxy_cache_valid 200 24h;
    }

    # ---- API：业务接口全部走 /api/，转发并透传真实 IP ----
    location /api/ {
        proxy_pass http://$app;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # ---- SEO 动态文件：sitemap.xml / robots.txt 由 App Router 动态生成 ----
    location = /sitemap.xml {
        proxy_pass http://$app;
        add_header Cache-Control "public, max-age=86400";
    }
    location = /robots.txt {
        proxy_pass http://$app;
        add_header Cache-Control "public, max-age=86400";
    }

    # ---- 站内公开静态目录（项目根 public/，经 Nginx 直出更快）----
    # 若 public/ 由 Nginx 直接服务，需要 root 指向部署目录；默认走代理即可。
    # location /public/ {
    #     root /var/www/wen-an;
    #     expires 7d;
    #     add_header Cache-Control "public, max-age=604800";
    # }

    # ---- 错误页：默认 Nginx 500/502/504 页即可；如需品牌化可改为转发 ----
    # location = /50x.html { root /usr/share/nginx/html; }
}

# =============================================================================
# 新增转发请求自查清单（新增路由/服务时必须逐项核对）：
#   1. 新页面路由 → 默认已被 `location /` 覆盖，无需改动；
#   2. 新 API 路由（/api/*）→ 已被 `location /api/` 覆盖，无需改动；
#   3. 新静态目录（非 /_next、非 public）→ 需新增 location 并写明缓存策略；
#   4. 新 WebSocket / SSE 服务 → 在对应 location 添加 upgrade 头；
#   5. 新端口 / 独立微服务 → 新增 upstream 与 server 块；
#   6. 改完务必 `nginx -t` 校验后再 reload。
# =============================================================================
